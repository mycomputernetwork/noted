# Fixture identities for AUTH_MODE=stub, mirroring auth's own dev users. The
# rejected cases are here because those paths are otherwise awkward to reach.
#
# Subjects are namespaced. Auth issues small integer ids, and a bare "2" here
# would claim whichever real account auth happens to number 2.
- sub: "stub-family"
  email: family@example.com
  name: Family Member

- sub: "stub-second"
  email: second@example.com
  name: Second Member

- sub: "stub-stranger"
  email: stranger@example.com
  name: Not Invited
  rejected_by_auth: true

- sub: "stub-revoked"
  email: revoked@example.com
  name: Revoked Member
  revoked_by_auth: true
