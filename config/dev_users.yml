# Fixture identities for AUTH_MODE=stub, mirroring auth's own dev users. The
# refused cases are here because those paths are otherwise awkward to reach.
#
# Subjects are namespaced. Auth issues UUIDs, and a bare "2" here would claim
# whichever real account auth happened to number 2 — which it once did.
- sub: "stub-1"
  email: dev1@example.com
  name: Dev user 1

- sub: "stub-2"
  email: dev2@example.com
  name: Dev user 2

- sub: "stub-3"
  email: dev3@example.com
  name: Dev user 3
  rejected_by_auth: true

- sub: "stub-4"
  email: dev4@example.com
  name: Dev user 4
  revoked_by_auth: true
