# SQLite for everything, including the Solid* backends.
#
# In production the database files live OUTSIDE the release directory so they
# survive Capistrano deploys (PRD §14). NOTED_DB_PATH points at that shared
# directory; it defaults to storage/ for anyone running production locally.

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cache:
    <<: *default
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("NOTED_DB_PATH") { "storage" } %>/production.sqlite3
  cache:
    <<: *default
    database: <%= ENV.fetch("NOTED_DB_PATH") { "storage" } %>/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("NOTED_DB_PATH") { "storage" } %>/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("NOTED_DB_PATH") { "storage" } %>/production_cable.sqlite3
    migrations_paths: db/cable_migrate
