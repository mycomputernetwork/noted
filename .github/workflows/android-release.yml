name: Android release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. android-v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write signing key
        env:
          NOTED_ANDROID_KEYSTORE_BASE64: ${{ secrets.NOTED_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$NOTED_ANDROID_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/noted"
          printf '%s' "$NOTED_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noted/release.jks"

      - name: Build signed APK
        working-directory: clients/android
        env:
          NOTED_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NOTED_ANDROID_KEYSTORE_PASSWORD }}
          NOTED_ANDROID_KEY_ALIAS: ${{ secrets.NOTED_ANDROID_KEY_ALIAS }}
          NOTED_ANDROID_KEY_PASSWORD: ${{ secrets.NOTED_ANDROID_KEY_PASSWORD }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#android-v}"
          ./gradlew --no-daemon assembleRelease \
            -PnotedVersionName="$version" \
            -PnotedVersionCode="${{ github.run_number }}" \
            -PnotedKeystore="$RUNNER_TEMP/noted/release.jks" \
            -PnotedKeystorePassword="$NOTED_ANDROID_KEYSTORE_PASSWORD" \
            -PnotedKeyAlias="$NOTED_ANDROID_KEY_ALIAS" \
            -PnotedKeyPassword="$NOTED_ANDROID_KEY_PASSWORD"

      - name: Stage release assets
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#android-v}"
          cp clients/android/app/build/outputs/apk/release/app-release.apk noted.apk
          cp noted.apk "noted-${version}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#android-v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" noted.apk "noted-${version}.apk" --clobber
          else
            gh release create "$tag" noted.apk "noted-${version}.apk" \
              --title "noted Android ${version}" \
              --notes "Signed Android APK for noted ${version}."
          fi
